name: CI

on:
  pull_request:
    branches: [local, main]
  push:
    branches: [main, local]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reset90_test
          POSTGRES_PASSWORD: reset90_test_password
          POSTGRES_DB: reset90_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://reset90_test:reset90_test_password@localhost:5432/reset90_test
      TEST_DATABASE_URL: postgresql://reset90_test:reset90_test_password@localhost:5432/reset90_test
      GPT_INGEST_TOKEN: test-token
      SESSION_SECRET: test-session-secret
      AUTH_MODE: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$PULL_REQUEST_BASE_SHA"

      - name: Run quality gate
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check
