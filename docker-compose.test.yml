services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reset90_test
      POSTGRES_PASSWORD: reset90_test_password
      POSTGRES_DB: reset90_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reset90_test -d reset90_test"]
      interval: 2s
      timeout: 3s
      retries: 15
