name: reset90

services:
  app:
    image: "reset90:${GIT_COMMIT:?GIT_COMMIT is required}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
        GIT_COMMIT: "${GIT_COMMIT:?GIT_COMMIT is required}"
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:?NODE_ENV is required}"
      AUTH_MODE: "${AUTH_MODE:?AUTH_MODE is required}"
      APP_URL: "${APP_URL:?APP_URL is required}"
      PORT: "${PORT:?PORT is required}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required}"
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:?AUTH_TRUST_HOST is required}"
      AUTH_AUTHENTIK_ID: "${AUTH_AUTHENTIK_ID:?AUTH_AUTHENTIK_ID is required}"
      AUTH_AUTHENTIK_SECRET: "${AUTH_AUTHENTIK_SECRET:?AUTH_AUTHENTIK_SECRET is required}"
      AUTH_AUTHENTIK_ISSUER: "${AUTH_AUTHENTIK_ISSUER:?AUTH_AUTHENTIK_ISSUER is required}"
      GPT_INGEST_TOKEN: "${GPT_INGEST_TOKEN:?GPT_INGEST_TOKEN is required}"
      GPT_INGEST_OWNER_SUBJECT: "${GPT_INGEST_OWNER_SUBJECT:?GPT_INGEST_OWNER_SUBJECT is required}"
      EXPORT_DIR: "${EXPORT_DIR:?EXPORT_DIR is required}"
      BACKUP_DIR: "${BACKUP_DIR:?BACKUP_DIR is required}"
      APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
      GIT_COMMIT: "${GIT_COMMIT:?GIT_COMMIT is required}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - reset90_exports:/app/exports
      - reset90_backups:/app/backups
    networks:
      - reset90_internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK is required}"
      - "traefik.http.routers.reset90.rule=Host(`${RESET90_HOST:?RESET90_HOST is required}`)"
      - "traefik.http.routers.reset90.entrypoints=${TRAEFIK_ENTRYPOINT:?TRAEFIK_ENTRYPOINT is required}"
      - "traefik.http.routers.reset90.tls=true"
      - "traefik.http.routers.reset90.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?TRAEFIK_CERT_RESOLVER is required}"
      - "traefik.http.services.reset90.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--output",
          "/dev/null",
          "--connect-timeout",
          "2",
          "--max-time",
          "5",
          "http://127.0.0.1:3000/api/ready",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    volumes:
      - reset90_postgres:/var/lib/postgresql/data
      - reset90_backups:/backups
    networks:
      - reset90_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  reset90_postgres:
  reset90_exports:
  reset90_backups:

networks:
  reset90_internal:
    driver: bridge
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:?TRAEFIK_NETWORK is required}"
